<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نموذج كتلي ثلاثي الأبعاد — المركز التعليمي والتدريبي الطبي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Cairo:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tajawal,sans-serif;background:#f4f2ee;color:#222;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;z-index:10;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#titlebar{display:flex;align-items:center;gap:10px;background:#3a3f4b;color:#fff;padding:3px 10px;font-size:12px}
#titlebar b{font-size:13px}#titlebar .qa{display:flex;gap:2px;margin-right:auto}
#titlebar .qa button{background:transparent;border:0;color:#fff;font-size:15px;padding:2px 8px}
#titlebar .qa button:hover{background:rgba(255,255,255,.15)}
#tabs{display:flex;gap:2px;background:#eef0f4;padding:3px 8px 0;overflow-x:auto}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;padding:5px 14px;font-size:13px;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;font-family:inherit;color:#333}
.tab.on{background:#fff;border-color:#d4d7de;font-weight:700;color:#2F3F9E}
.tab.ctx{background:#e2f2e2;color:#1f6b2a;display:none}.tab.ctx.on{background:#fff;color:#1f6b2a;border-color:#9ccc9c}
#ribbon{height:96px;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;border-top:1px solid #d4d7de;background:#fff}
.pane{display:none;align-items:stretch}.pane.on{display:flex}
.grp{display:flex;flex-direction:column;border-left:1px solid #e3e5ea;padding:4px 8px 0}
.gb{flex:1;display:flex;gap:4px;align-items:center}
.gc{font-size:11px;color:#888;text-align:center;padding:2px 0 3px;white-space:nowrap}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:54px;height:64px;padding:2px 6px;font-size:12px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;font-family:inherit;color:#222;white-space:nowrap}
.big i{font-style:normal;font-size:22px;line-height:1}
.big:hover{background:#eef2fb;border-color:#cdd6ee}.big.on{background:#dfe6fb;border-color:#9fb1e8}
.big.warn i,.big.warn{color:#b00}.big.armed{background:#b00;color:#fff}
.col{display:flex;flex-direction:column;gap:3px;justify-content:center}
.fld{display:flex;align-items:center;gap:4px;font-size:12px;color:#555;white-space:nowrap}
.fld select,.fld input{font-family:inherit;font-size:12px;padding:2px 4px;border:1px solid #c9ccd3;border-radius:4px;background:#fff}
.fld input[type=number]{width:62px;text-align:center}.fld input[type=text]{width:130px}
.sm{font-family:inherit;font-size:12px;border:1px solid #c9ccd3;background:#f7f8fa;border-radius:4px;padding:2px 7px;cursor:pointer;color:#222}
.sm:hover{background:#e9ecf2}.sm.on{background:#2F3F9E;color:#fff;border-color:#2F3F9E}.sm.armed{background:#b00;color:#fff;border-color:#b00}
.sides{display:grid;grid-template-columns:auto auto auto auto auto;gap:2px 3px;align-items:center;font-size:11px;color:#555}
.sides .sm{padding:0 5px;font-size:11px}
#v{position:fixed;left:0;right:0;bottom:28px;touch-action:none}
#status{position:fixed;bottom:0;left:0;right:0;height:28px;background:#3a3f4b;color:#e8e8e8;font-size:12px;display:flex;align-items:center;gap:18px;padding:0 12px;overflow-x:auto;white-space:nowrap}
#status b{color:#ffc58a}
#lab{position:fixed;pointer-events:none;background:#222;color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;transform:translate(-50%,-130%);white-space:nowrap;display:none;z-index:5}
.nl{position:fixed;pointer-events:none;background:rgba(255,255,255,.88);color:#222;font-size:11px;padding:1px 6px;border-radius:5px;transform:translate(-50%,-50%);white-space:nowrap;border:1px solid #ddd;z-index:4}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
#modal .box{background:#fff;border-radius:12px;padding:16px;width:min(560px,92vw)}
#modal textarea{width:100%;height:220px;font-family:monospace;font-size:12px;direction:ltr}
#msg{position:fixed;top:150px;left:50%;transform:translateX(-50%);background:#2F7D32;color:#fff;padding:6px 14px;border-radius:8px;font-size:13px;display:none;z-index:30}
.fnb{display:flex;flex-direction:column;justify-content:center;width:120px;font-size:11px}
.fnb .bar{height:7px;background:#eee;border-radius:4px;overflow:hidden;margin-top:2px}.fnb .bar i{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:4px;vertical-align:-1px}
.hint{color:#888;font-size:11px}
.fld input[type=range]{width:110px}.fld input[type=date]{width:130px}
#mlab{position:fixed;pointer-events:none;background:#b00020;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap;display:none;z-index:6}
#shot{max-width:100%;max-height:60vh;display:block;margin:8px auto;border:1px solid #ddd}
.warnTxt{color:#ffb3b3}
#ctx{position:fixed;display:none;background:#fff;border:1px solid #ccd;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:40;min-width:180px;padding:4px 0;font-size:13px}
#ctx div{padding:6px 14px;cursor:pointer}#ctx div:hover{background:#eef2fb}
#elBox{display:flex;flex-wrap:wrap;gap:4px;max-height:80px;overflow:auto;max-width:calc(100vw - 40px);align-content:flex-start}
.chip{display:flex;align-items:center;gap:3px;border:1px solid #d4d7de;border-radius:14px;padding:1px 4px 1px 8px;font-size:12px;background:#f7f8fa}
.chip.on{background:#ffe9b8;border-color:#ffb000}.chip.off{opacity:.5}
.chip .nm{cursor:pointer;white-space:nowrap}.chip button{border:0;background:transparent;cursor:pointer;font-size:12px;padding:0 2px}
#sheetWrap{position:fixed;left:0;right:0;bottom:28px;background:#5b6070;display:none;z-index:8;overflow:auto;direction:ltr;padding:24px}
#sheetPage{position:relative;margin:0 auto;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.4);overflow:hidden}
.sitem{position:absolute;cursor:move;touch-action:none}.sitem img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.sitem.sel{outline:2px solid #ff8f00;outline-offset:1px}.sitem:hover{outline:1px dashed #9aa}
.stext{width:100%;height:100%;font-family:Tajawal,sans-serif;direction:rtl;line-height:1.35;white-space:pre-wrap;overflow:hidden;outline:none}
.stext[contenteditable=true]{background:#fffbe6;cursor:text;overflow:visible}
.srh{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#ff8f00;border:2px solid #fff;border-radius:3px;cursor:nwse-resize}
.sframe{position:absolute;border:1.5px solid #222;pointer-events:none}
.sitem img{mix-blend-mode:multiply}
#cropBox{position:relative;display:inline-block;overflow:hidden;touch-action:none;user-select:none}
#cropImg{display:block;max-width:min(78vw,900px);max-height:60vh}
#cropRect{position:absolute;border:2px solid #ff8f00;box-shadow:0 0 0 9999px rgba(0,0,0,.5);cursor:move}
#cropRect span{position:absolute;width:14px;height:14px;background:#ff8f00;border:2px solid #fff;border-radius:3px}
#cropRect [data-c=nw]{left:-8px;top:-8px;cursor:nwse-resize}#cropRect [data-c=ne]{right:-8px;top:-8px;cursor:nesw-resize}
#cropRect [data-c=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}#cropRect [data-c=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
#cropRect [data-c=n]{left:calc(50% - 7px);top:-8px;cursor:ns-resize}#cropRect [data-c=s]{left:calc(50% - 7px);bottom:-8px;cursor:ns-resize}
#cropRect [data-c=w]{top:calc(50% - 7px);left:-8px;cursor:ew-resize}#cropRect [data-c=e]{top:calc(50% - 7px);right:-8px;cursor:ew-resize}
#modal .box{width:auto;min-width:min(560px,92vw);max-width:94vw}
.qchk{display:flex;align-items:center;gap:6px;cursor:pointer}
.hqb{position:absolute;top:2px;left:2px;background:#2F3F9E;color:#fff;font-size:9px;padding:0 4px;border-radius:3px;opacity:.75;pointer-events:none}
.rep{max-height:62vh;overflow:auto;font-size:12.5px}.rep table{border-collapse:collapse;width:100%;margin:6px 0 12px}.rep th,.rep td{border:1px solid #e1e3e8;padding:4px 7px;text-align:right;white-space:nowrap}.rep th{background:#f3f4f7;font-weight:700}
.rep tr.cur td{background:#fff6dd}.rep .neg{color:#c62828}.rep .pos{color:#2e7d32}.rep h4{margin:10px 0 2px;color:#9C3F24}
.repk{display:flex;gap:8px;flex-wrap:wrap}.repk div{background:#f6f3ef;border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-width:90px}.repk b{font-size:18px;color:#9C3F24}.repk span{font-size:11px;color:#666}
.sguide{position:absolute;background:#e91e63;pointer-events:none;z-index:50}
.sitem.lk{cursor:default}.sitem.lk::after{content:"🔒";position:absolute;top:-2px;right:2px;font-size:10px}
.sitem svg text{font-family:Tajawal}
.sitem.editing{cursor:text;outline:2px solid #2F3F9E!important}
.gal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:3px}
.gal button{font-family:inherit;font-size:12px;border:1px solid #d4d7de;background:#fff;border-radius:6px;padding:2px 6px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;min-height:26px}
.gal button:hover{background:#eef2fb}.gal button.on{border-color:#2F3F9E;background:#dfe6fb;font-weight:700}
.gal button .dot{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);display:inline-block}
.gal button i{font-style:normal;font-size:15px}
.tab.dotted::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e53935;margin-right:5px;vertical-align:middle}
@media (max-width:820px){#titlebar>span{display:none}#titlebar{padding:2px 6px}.big{min-width:46px;height:58px;font-size:11px;padding:2px 4px}.big i{font-size:19px}.tab{padding:5px 9px;font-size:12px}#ribbon{height:90px;touch-action:pan-x}.grp{padding:3px 5px 0}.gc{font-size:10px}#status{font-size:11px;gap:10px}}
#shZoomBar{position:fixed;left:14px;bottom:40px;z-index:9;background:#fff;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.25);padding:4px 6px;display:none;gap:4px;align-items:center}
#shZoomBar b{min-width:40px;text-align:center;font-size:12px}
.expsec{border:1px solid #e3e5ea;border-radius:10px;padding:10px 12px;margin:8px 0}.expgrid{display:grid;grid-template-columns:1fr;gap:5px;margin-top:6px}
.sm.pri2{background:#2F3F9E;color:#fff;border-color:#2F3F9E;padding:5px 14px}
#cloudSt{background:rgba(255,255,255,.12);border:0;color:#ddd;border-radius:10px;padding:1px 9px;font-size:11.5px;font-family:inherit;cursor:pointer;margin-inline-start:8px}
#cloudSt.ok{color:#9be7a0}#cloudSt.sync{color:#ffd27a}#cloudSt.err{color:#ff9a9a}#cloudSt.off{color:#aaa}
#tour{position:fixed;inset:auto 0 44px 0;display:none;justify-content:center;z-index:60;pointer-events:none}
#tour .tbox{pointer-events:auto;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:14px 16px;width:min(460px,92vw);font-size:13.5px;line-height:1.8;border-top:4px solid #2F3F9E}
#tour .thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}#tour .thead b{font-size:16px;color:#2F3F9E}
#tour .tfoot{display:flex;gap:6px;margin-top:10px}
.tourhl{box-shadow:0 0 0 3px #ffb000,0 0 18px rgba(255,176,0,.8)!important;border-radius:8px;position:relative;z-index:11}

#pins{position:fixed;inset:0;pointer-events:none;z-index:5}
.pin{position:fixed;pointer-events:auto;cursor:pointer;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:translate(-30%,-100%) rotate(-45deg);background:#1565c0;color:#fff;font:700 11px Tajawal,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.35);border:2px solid #fff}
.pin.sup{background:#e65100}.pin.done{background:#9e9e9e;opacity:.7}
.nrow{display:flex;gap:6px;align-items:flex-start;padding:7px;border-bottom:1px solid #eee}.nrow.done .nt{text-decoration:line-through;color:#888}.nrow.hl{background:#fff8e1}
.nnum{min-width:22px;height:22px;border-radius:50%;background:#1565c0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}.nnum.sup{background:#e65100}
.ntx{flex:1}.nb{font-size:11px;color:#777}.nt{white-space:pre-wrap;line-height:1.6}
#modal .box.wide{width:min(1100px,96vw);max-width:96vw}
.pgWrap{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;max-height:62vh}.pgWrap>div{overflow:auto;max-height:60vh;padding-inline-end:4px}
@media(max-width:760px){.pgWrap{grid-template-columns:1fr;max-height:none}.pgWrap>div{max-height:36vh}}
.pgH{margin:10px 0 4px;font-weight:700;display:flex;align-items:center;gap:6px}
.pgR{display:flex;gap:4px;margin:2px 0;align-items:center}.pgR .pgN{flex:1;min-width:90px;font-size:12px}.pgR .pgA{width:58px;font-size:12px}.pgR .pgS{width:44%;font-size:11.5px}
.pgC{padding:6px 0;border-bottom:1px solid #eee}.pgCt{display:flex;gap:6px;align-items:center;font-weight:600}.pgCl{font-size:11px;color:#666;margin-top:2px;line-height:1.5}
.pgC .bar,.fnb .bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:3px}.pgC .bar i{display:block;height:100%}
#rvBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff3e0;border-bottom:2px solid #e65100;padding:6px 10px;font-size:13px}
#rvBar button{border:1px solid #e0b080;background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}#rvBar button.pri{background:#e65100;color:#fff;border-color:#e65100}
@media(max-width:700px){.grp .gc{display:none}#ribbon .big{min-width:48px;font-size:10.5px;padding:3px 4px}#ribbon .big i{font-size:17px}#titlebar>span{display:none}#titlebar b{font-size:12px}.fld{font-size:11.5px}}
.revmode #tabs,.revmode #ribbon{display:none}#rvBar .rvv{display:flex;gap:4px;margin-inline-start:auto}#rvBar button.on{background:#ffe0b2}
</style></head><body>
