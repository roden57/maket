<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استوديو النمذجة الكتلية ثلاثية الأبعاد</title>
<meta name="description" content="أداة نمذجة كتلية معمارية ثلاثية الأبعاد في المتصفح مع تحليل الشمس والرياح، توزيع البرنامج الوظيفي، إعداد اللوحات المعمارية A4–A1، والتصدير إلى Revit وAutoCAD وSketchUp وPDF.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ماكيت Maket">
<meta property="og:locale" content="ar_IQ">
<meta property="og:url" content="https://roden57.github.io/maket/">
<meta property="og:title" content="ماكيت — المركز التعليمي والتدريبي الطبي">
<meta property="og:description" content="نموذج كتلي ثلاثي الأبعاد لمشروع تخرج — افتح الرابط لمراجعة التصميم وإضافة ملاحظاتك على الكتل مباشرة.">
<meta property="og:image" content="https://roden57.github.io/maket/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="نموذج كتلي للمركز التعليمي والتدريبي الطبي — باب المعظم، بغداد">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://roden57.github.io/maket/og.jpg">
<meta name="theme-color" content="#1e40af">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f3f5;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --ink:#0f172a;
  --ink-2:#334155;
  --muted:#64748b;
  --line:#e2e8f0;
  --line-strong:#cbd5e1;
  --acc:#1e40af;
  --acc-hover:#1d4ed8;
  --acc-soft:#eff6ff;
  --acc-line:#bfdbfe;
  --danger:#b91c1c;
  --danger-soft:#fef2f2;
  --ok:#15803d;
  --warn:#b45309;
  --top-h:52px;
  --insp-w:316px;
  --foot-h:32px;
  --radius:6px;
  --font-ui:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--acc);
  outline-offset:1px;
}

/* Icons */
.ic{
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none;
}

/* Top Bar (3-zone architectural header) */
#top{
  position:fixed;
  top:0;left:0;right:0;
  height:var(--top-h);
  z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:0 16px;
}
.top-brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex-shrink:0;
}
.brand-mark{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:16px;
  font-weight:700;
  color:var(--ink);
  letter-spacing:-0.01em;
  white-space:nowrap;
}
.brand-cube{
  width:22px;
  height:22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--acc);
  color:#fff;
  border-radius:4px;
}
.brand-cube .ic{width:14px;height:14px}
#langBtn{
  height:26px;
  padding:0 8px;
  border:1px solid var(--line-strong);
  background:var(--surface-2);
  color:var(--ink-2);
  border-radius:4px;
  font-size:11.5px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
  line-height:1;
  transition:background .15s,border-color .15s,color .15s;
}
#langBtn:hover{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
#curname{
  font-size:12.5px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:150px;
}
#curname.unsaved{
  color:#b45309;
  font-weight:600;
}

/* Workspace Tabs */
#tabs{
  display:flex;
  align-items:center;
  gap:1px;
  overflow-x:auto;
  scrollbar-width:none;
  flex:1;
  justify-content:center;
  min-width:0;
  padding:4px 0;
}
#tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;
  border:0;
  background:transparent;
  color:var(--ink-2);
  padding:6px 7px;
  font-size:12px;
  font-weight:500;
  border-radius:var(--radius);
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
  transition:background .15s cubic-bezier(.16,1,.3,1),color .15s;
}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab.on{
  background:var(--acc-soft);
  color:var(--acc);
  font-weight:600;
}
header#top:nth-of-type(1) > nav#tabs:nth-of-type(1) > button:nth-of-type(3).on,
header#top:nth-of-type(1) > nav#tabs:nth-of-type(1) > button:nth-of-type(4).on,
header#top:nth-of-type(1) > nav#tabs:nth-of-type(1) > button:nth-of-type(5).on,
header#top:nth-of-type(1) > nav#tabs:nth-of-type(1) > button:nth-of-type(6).on,
header#top > nav#tabs > button[data-t="facade"].on,
header#top > nav#tabs > button[data-t="mass"].on{
  background:linear-gradient(180deg,rgba(30,64,175,.14) 0%,rgba(239,246,255,.96) 100%);
  color:var(--acc);
  font-weight:600;
  box-shadow:inset 0 2.5px 0 var(--acc),inset 0 0 0 1px var(--acc-line),0 1px 2px rgba(30,64,175,.08);
}
header#top > nav#tabs > button[data-t="facade"],
header#top > nav#tabs > button[data-t="mass"]{
  display:inline-flex;
  align-items:center;
  gap:5px;
}
header#top > nav#tabs > button[data-t="facade"] .ic-facade,
header#top > nav#tabs > button[data-t="mass"] .ic-mass{
  width:15px;
  height:15px;
  flex:none;
}
header#top > nav#tabs > button:nth-of-type(5){
  display:inline-flex;
  align-items:center;
  gap:5px;
}
header#top > nav#tabs > button:nth-of-type(5) .ic-sunwind{
  width:16px;
  height:16px;
  flex:none;
  overflow:visible;
}
header#top > nav#tabs > button:nth-of-type(5) .sw-sun{
  transform-box:fill-box;
  transform-origin:center;
  animation:swSunSpin 18s linear infinite;
}
header#top > nav#tabs > button:nth-of-type(5):hover .sw-sun,
header#top > nav#tabs > button:nth-of-type(5).on .sw-sun{
  animation-duration:7s;
}
header#top > nav#tabs > button:nth-of-type(5) .sw-wind{
  stroke-dasharray:18 6;
  animation:swWindFlow 3.2s linear infinite;
}
header#top > nav#tabs > button:nth-of-type(5) .sw-wind-2{
  stroke-dasharray:14 5;
  animation-duration:2.6s;
  animation-delay:-0.9s;
}
@keyframes swSunSpin{
  to{transform:rotate(360deg)}
}
@keyframes swWindFlow{
  from{stroke-dashoffset:24}
  to{stroke-dashoffset:0}
}
@media (prefers-reduced-motion:reduce){
  header#top > nav#tabs > button:nth-of-type(5) .sw-sun,
  header#top > nav#tabs > button:nth-of-type(5) .sw-wind{
    animation:none!important;
  }
}
.tab.ctx{
  display:none;
  color:var(--acc);
  border:1px solid var(--acc-line);
  background:#fff;
}
.tab.ctx.on{
  background:var(--acc);
  color:#fff;
  border-color:var(--acc);
}
.tab.dotted::after{
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--danger);
  margin-inline-start:5px;
  vertical-align:middle;
}

/* Top Right Actions */
.top-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}
.qa{
  display:flex;
  align-items:center;
  gap:4px;
}
.icon-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border:1px solid transparent;
  background:transparent;
  color:var(--ink-2);
  border-radius:var(--radius);
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.btn-primary{
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:34px;
  padding:0 14px;
  border:0;
  border-radius:var(--radius);
  background:var(--acc);
  color:#fff;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
  transition:background .15s;
}
.btn-primary:hover{background:var(--acc-hover)}
.btn-primary .ic{width:15px;height:15px}
#cloudSt{
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:32px;
  padding:0 10px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-2);
  border-radius:var(--radius);
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
}
#cloudSt:hover{border-color:var(--line-strong);color:var(--ink)}
#cloudSt.ok{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
#cloudSt.sync{color:var(--warn);border-color:#fde68a;background:#fffbeb}
#cloudSt.err{color:var(--danger);border-color:#fecaca;background:var(--danger-soft)}
#userSt{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--ink-2);
  white-space:nowrap;
}
#revSel{
  height:32px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:0 8px;
  font-size:12px;
  background:#fff;
}

/* Main 3D Canvas Viewport */
#v{
  position:fixed;
  top:var(--top-h);
  bottom:var(--foot-h);
  left:0;
  right:var(--insp-w);
  touch-action:none;
  background:var(--bg);
  transition:right .2s cubic-bezier(.16,1,.3,1);
}
body.insp-closed #v{right:0}

/* Sheet Editor Wrapper */
#sheetWrap{
  position:fixed;
  top:var(--top-h);
  bottom:var(--foot-h);
  left:0;
  right:var(--insp-w);
  background:#475569;
  display:none;
  z-index:12;
  overflow:auto;
  direction:ltr;
  padding:28px;
  transition:right .2s cubic-bezier(.16,1,.3,1);
}
body.insp-closed #sheetWrap{right:0}

/* Collapsible Right Inspector Sidebar */
#inspector{
  position:fixed;
  top:var(--top-h);
  bottom:var(--foot-h);
  right:0;
  width:var(--insp-w);
  background:var(--surface);
  border-left:1px solid var(--line);
  z-index:16;
  display:flex;
  flex-direction:column;
  transition:transform .2s cubic-bezier(.16,1,.3,1);
}
body.insp-closed #inspector{
  transform:translateX(100%);
}
#inspToggle{
  position:fixed;
  top:calc(var(--top-h) + 12px);
  right:calc(var(--insp-w) + 10px);
  z-index:17;
  width:34px;
  height:34px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-2);
  border-radius:var(--radius);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 1px 4px rgba(15,23,42,.08);
  transition:right .2s cubic-bezier(.16,1,.3,1),background .15s;
}
#inspToggle:hover{background:var(--surface-2);color:var(--ink)}
body.insp-closed #inspToggle{right:12px}

#ribbon{
  position:relative;
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:0;
}
.pane{
  display:none;
  flex-direction:column;
  opacity:0;
  transform:translateY(5px);
}
.pane.entering{
  display:flex;
  opacity:0;
  transform:translateY(5px);
}
.pane.on{
  display:flex;
  position:relative;
  z-index:1;
  opacity:1;
  transform:translateY(0);
  transition:opacity .2s cubic-bezier(.16,1,.3,1) .04s,transform .2s cubic-bezier(.16,1,.3,1) .04s;
}
.pane.leaving-prep{
  display:flex;
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:0;
  opacity:1;
  transform:translateY(0);
  pointer-events:none;
}
.pane.leaving{
  opacity:0;
  transform:translateY(-4px);
  transition:opacity .14s ease-out,transform .14s ease-out;
}
@media (prefers-reduced-motion:reduce){
  .pane,.pane.entering,.pane.on,.pane.leaving-prep,.pane.leaving{
    transition:none!important;
    transform:none!important;
  }
}

/* Inspector Section Cards */
.grp{
  display:flex;
  flex-direction:column;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.grp:last-child{border-bottom:0}
.gc{
  order:-1;
  font-size:12px;
  font-weight:600;
  color:var(--ink-2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0;
}
.gb{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.gb-row{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
.gb-row-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
}
.col{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.fld{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:12.5px;
  color:var(--ink-2);
  min-height:32px;
}
.fld label,.fld-lbl{color:var(--muted);font-size:12px;white-space:nowrap}
.fld select,.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=password]{
  font-family:inherit;
  font-size:12.5px;
  height:32px;
  padding:4px 8px;
  border:1px solid var(--line-strong);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  min-width:0;
}
.fld select{flex:1}
.fld input[type=number]{
  width:72px;
  text-align:center;
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;
}
.fld input[type=text]{flex:1;min-width:90px}
.fld input[type=range]{flex:1;accent-color:var(--acc);cursor:pointer}
.fld-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.fld-stack{
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:12px;
  color:var(--muted);
}
.fld-stack select,.fld-stack input{
  width:100%;
  height:32px;
  padding:4px 8px;
  border:1px solid var(--line-strong);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  font-size:12.5px;
}

/* Action Buttons inside Inspector */
.big{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:36px;
  padding:6px 10px;
  font-size:12.5px;
  font-weight:500;
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:var(--radius);
  cursor:pointer;
  color:var(--ink);
  white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.big i{
  font-style:normal;
  display:inline-flex;
  align-items:center;
  color:var(--acc);
}
.big i .ic{width:16px;height:16px}
.big:hover{background:#f1f5f9;border-color:var(--line-strong)}
.big.on{
  background:var(--acc-soft);
  border-color:var(--acc-line);
  color:var(--acc);
  font-weight:600;
}
.big.warn,.big.warn i{color:var(--danger)}
.big.warn:hover{background:var(--danger-soft);border-color:#fecaca}
.big.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.big.armed i{color:#fff}

.sm{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:30px;
  padding:4px 10px;
  font-size:12px;
  font-weight:500;
  border:1px solid var(--line-strong);
  background:#fff;
  border-radius:4px;
  cursor:pointer;
  color:var(--ink-2);
  white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.sm:hover{background:var(--surface-2);color:var(--ink)}
.sm.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sm.pri2{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.sm.pri2:hover{background:var(--acc-hover)}
.sm.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.stepper{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.stepper .sm{
  width:28px;
  min-width:28px;
  padding:0;
}
.stepper input[type=number]{width:60px}

/* Floating Tool Rail on Canvas (Left side of 3D viewport) */
#toolRail{
  position:fixed;
  top:calc(var(--top-h) + 12px);
  left:12px;
  z-index:11;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:6px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:0 2px 10px rgba(15,23,42,.08);
}
.rail-btn{
  display:flex;
  align-items:center;
  gap:7px;
  height:36px;
  padding:0 10px;
  border:1px solid transparent;
  background:transparent;
  border-radius:5px;
  cursor:pointer;
  color:var(--ink-2);
  font-size:12.5px;
  font-weight:500;
  white-space:nowrap;
  transition:background .15s,color .15s;
}
.rail-btn .ic{width:17px;height:17px;color:var(--ink-2)}
.rail-btn:hover{background:var(--surface-2);color:var(--ink)}
.rail-btn.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line);font-weight:600}
.rail-btn.on .ic{color:var(--acc)}
.rail-sep{height:1px;background:var(--line);margin:2px 4px}
body.sheet-mode #toolRail,body.sheet-mode #camHud{display:none}
body.revmode #toolRail{display:none}

/* Floating Quick Camera Bar (Bottom-left of 3D viewport) */
#camHud{
  position:fixed;
  left:12px;
  bottom:calc(var(--foot-h) + 12px);
  z-index:11;
  display:flex;
  align-items:center;
  gap:2px;
  padding:4px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:0 2px 10px rgba(15,23,42,.08);
}
#camHud button{
  display:inline-flex;
  align-items:center;
  gap:5px;
  height:32px;
  padding:0 10px;
  border:0;
  background:transparent;
  border-radius:5px;
  font-size:12px;
  font-weight:500;
  color:var(--ink-2);
  cursor:pointer;
  white-space:nowrap;
}
#camHud button:hover{background:var(--surface-2);color:var(--ink)}
#camHud button .ic{width:14px;height:14px;color:var(--acc)}

/* Elements Outliner List inside Modeling Pane */
#elBox{
  display:flex;
  flex-direction:column;
  gap:3px;
  max-height:280px;
  overflow-y:auto;
}
.chip{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid transparent;
  border-radius:5px;
  padding:5px 8px;
  font-size:12.5px;
  background:var(--surface-2);
  transition:background .12s,border-color .12s;
}
.chip:hover{background:#f1f5f9;border-color:var(--line)}
.chip.on{background:var(--acc-soft);border-color:var(--acc-line);font-weight:600;color:var(--acc)}
.chip.off{opacity:.5}

/* Architectural Analysis Studio (#p_mass sub-views) */

  border-radius:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

}
.an-subtabs button:hover,.an-envtabs button:hover,.an-seg2 button:hover{color:var(--ink)}
.an-subtabs button.on,.an-envtabs button.on,.an-seg2 button.on{

}
.an-envtabs{
  display:grid;

}

}

}

}

.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px;flex:none}
.hint{color:var(--muted);font-size:11.5px}
.warnTxt{color:var(--danger);font-weight:500}

/* Overlays, Labels, Toast */
#lab,#mlab{
  position:fixed;
  pointer-events:none;
  font-size:12px;
  font-family:var(--font-mono);
  padding:4px 9px;
  border-radius:4px;
  transform:translate(-50%,-135%);
  white-space:nowrap;
  display:none;
  z-index:15;
}
#lab{background:var(--ink);color:#fff}
#mlab{background:var(--danger);color:#fff;z-index:16}
.nl{
  position:fixed;
  pointer-events:none;
  background:rgba(255,255,255,.94);
  color:var(--ink);
  font-size:11px;
  font-weight:600;
  padding:2px 7px;
  border-radius:4px;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  border:1px solid var(--line-strong);
  z-index:10;
}
#msg{
  position:fixed;
  top:calc(var(--top-h) + 12px);
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:8px 16px;
  border-radius:6px;
  font-size:13px;
  display:none;
  z-index:50;
  box-shadow:0 8px 24px rgba(15,23,42,.2);
}

/* Context Menu */
#ctx{
  position:fixed;
  display:none;
  background:#fff;
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:0 10px 30px rgba(15,23,42,.15);
  z-index:60;
  min-width:190px;
  padding:4px;
  font-size:13px;
  max-height:calc(100vh - 16px);
  overflow-y:auto;
  overscroll-behavior:contain;
}
#ctx div.ctx-h{
  cursor:default;
  margin-top:4px;
  padding:8px 12px 4px;
  border-top:1px solid var(--line);
  font-size:11px;
  font-weight:600;
  color:var(--muted);
}
#ctx div.ctx-h:hover{background:transparent;color:var(--muted)}
#ctx div{
  padding:7px 12px;
  cursor:pointer;
  border-radius:4px;
}
#ctx div:hover{background:var(--acc-soft);color:var(--acc)}

/* Modals */
#modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  backdrop-filter:blur(2px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:70;
  padding:16px;
}
#modal .box{
  background:#fff;
  border-radius:8px;
  padding:20px 22px;
  width:auto;
  min-width:min(540px,92vw);
  max-width:94vw;
  max-height:90vh;
  overflow-y:auto;
  border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(15,23,42,.25);
}
#modal .box.wide{width:min(1100px,96vw)}
#mTitle{
  display:block;
  font-size:16px;
  font-weight:700;
  color:var(--ink);
  padding-bottom:10px;
  margin-bottom:12px;
  border-bottom:1px solid var(--line);
}
#modal textarea{
  width:100%;
  height:220px;
  font-family:var(--font-mono);
  font-size:12px;
  direction:ltr;
  border:1px solid var(--line-strong);
  border-radius:6px;
  padding:8px;
}
#shot{max-width:100%;max-height:60vh;display:block;margin:10px auto;border:1px solid var(--line)}

/* Sheet Editor Elements */
#sheetPage{position:relative;margin:0 auto;background:#fff;box-shadow:0 10px 36px rgba(15,23,42,.45);overflow:hidden}
.sitem{position:absolute;cursor:move;touch-action:none}
.sitem img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;mix-blend-mode:multiply}
.sitem.sel{outline:2px solid var(--acc);outline-offset:1px}
.sitem:hover{outline:1px dashed #94a3b8}
.stext{width:100%;height:100%;font-family:var(--font-ui);direction:inherit;line-height:1.35;white-space:pre-wrap;overflow:hidden;outline:none}
.stext[contenteditable=true]{background:#fefce8;cursor:text;overflow:visible}
.srh{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:var(--acc);border:2px solid #fff;border-radius:3px;cursor:nwse-resize}
.sframe{position:absolute;border:1.5px solid #1e293b;pointer-events:none}
.hqb{position:absolute;top:2px;left:2px;background:var(--acc);color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;opacity:.85;pointer-events:none}
.sguide{position:absolute;background:#e11d48;pointer-events:none;z-index:50}
.sitem.lk{cursor:default}.sitem.lk::after{content:"🔒";position:absolute;top:-2px;right:2px;font-size:10px}
.sitem svg text{font-family:var(--font-ui)}
.sitem.editing{cursor:text;outline:2px solid var(--acc)!important}

#shZoomBar{
  position:fixed;
  left:14px;
  bottom:calc(var(--foot-h) + 14px);
  z-index:15;
  background:#fff;
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:0 4px 16px rgba(15,23,42,.15);
  padding:4px 6px;
  display:none;
  gap:4px;
  align-items:center;
}
#shZoomBar b{min-width:44px;text-align:center;font-size:12px;font-family:var(--font-mono)}

/* Cropper */
#cropBox{position:relative;display:inline-block;overflow:hidden;touch-action:none;user-select:none}
#cropImg{display:block;max-width:min(78vw,900px);max-height:60vh}
#cropRect{position:absolute;border:2px solid var(--acc);box-shadow:0 0 0 9999px rgba(15,23,42,.55);cursor:move}
#cropRect span{position:absolute;width:14px;height:14px;background:var(--acc);border:2px solid #fff;border-radius:3px}
#cropRect [data-c=nw]{left:-8px;top:-8px;cursor:nwse-resize}
#cropRect [data-c=ne]{right:-8px;top:-8px;cursor:nesw-resize}
#cropRect [data-c=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}
#cropRect [data-c=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
#cropRect [data-c=n]{left:calc(50% - 7px);top:-8px;cursor:ns-resize}
#cropRect [data-c=s]{left:calc(50% - 7px);bottom:-8px;cursor:ns-resize}
#cropRect [data-c=w]{top:calc(50% - 7px);left:-8px;cursor:ew-resize}
#cropRect [data-c=e]{top:calc(50% - 7px);right:-8px;cursor:ew-resize}

/* Reports, Export, Program, Notes, Tour, Review */
.qchk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.rep{max-height:62vh;overflow:auto;font-size:12.5px}
.rep table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.rep th,.rep td{border:1px solid var(--line);padding:6px 10px;text-align:start;white-space:nowrap}
.rep th{background:var(--surface-2);font-weight:600;color:var(--ink)}
.rep tr.cur td{background:#fffbeb}
.rep .neg{color:var(--danger)}
.rep .pos{color:var(--ok)}
.rep h4{margin:14px 0 6px;color:var(--ink);font-size:14px}
.repk{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px}
.repk div{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.repk b{font-size:18px;color:var(--acc);font-family:var(--font-mono)}
.repk span{font-size:11.5px;color:var(--muted)}

.expsec{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0;background:var(--surface-2)}
.expgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

#tour{position:fixed;inset:auto 0 48px 0;display:none;justify-content:center;z-index:60;pointer-events:none}
#tour .tbox{pointer-events:auto;background:#fff;border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:8px;box-shadow:0 16px 40px rgba(15,23,42,.22);padding:16px 18px;width:min(460px,92vw);font-size:13.5px;line-height:1.75}
#tour .thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#tour .thead b{font-size:15px;color:var(--ink)}
#tour .tfoot{display:flex;gap:6px;margin-top:12px}
.tourhl{box-shadow:0 0 0 2px var(--acc),0 0 0 6px rgba(30,64,175,.18)!important}

#pins{position:fixed;inset:0;pointer-events:none;z-index:11}
.pin{position:fixed;pointer-events:auto;cursor:pointer;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:translate(-30%,-100%) rotate(-45deg);background:var(--acc);color:#fff;font:700 11px var(--font-ui);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(15,23,42,.3);border:2px solid #fff}
.pin.sup{background:#d97706}.pin.done{background:#94a3b8;opacity:.75}
.nrow{display:flex;gap:8px;align-items:flex-start;padding:8px;border-bottom:1px solid var(--line)}
.nrow.done .nt{text-decoration:line-through;color:var(--muted)}.nrow.hl{background:#fefce8}
.nnum{min-width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.nnum.sup{background:#d97706}
.ntx{flex:1}.nb{font-size:11.5px;color:var(--muted)}.nt{white-space:pre-wrap;line-height:1.6}

.pgWrap{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;max-height:60vh}
.pgWrap>div{overflow:auto;max-height:58vh;padding-inline-end:6px}
.pgH{margin:10px 0 6px;font-weight:700;display:flex;align-items:center;gap:6px}
.pgR{display:flex;gap:6px;margin:4px 0;align-items:center}
.pgR .pgN{flex:1;min-width:90px;font-size:12px;height:30px;padding:2px 6px;border:1px solid var(--line-strong);border-radius:4px}
.pgR .pgA{width:64px;font-size:12px;height:30px;padding:2px 6px;border:1px solid var(--line-strong);border-radius:4px;font-family:var(--font-mono)}
.pgR .pgS{width:42%;font-size:11.5px;height:30px;padding:2px 6px;border:1px solid var(--line-strong);border-radius:4px}
.pgC{padding:8px 0;border-bottom:1px solid var(--line)}
.pgCt{display:flex;gap:6px;align-items:center;font-weight:600}
.pgCl{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.pgC .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.pgC .bar i{display:block;height:100%}

/* Review Mode */
#rvBar{
  position:fixed;
  top:var(--top-h);
  left:0;right:0;
  z-index:19;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
  padding:8px 16px;
  font-size:13px;
}
#rvBar button{border:1px solid var(--line-strong);background:#fff;border-radius:4px;padding:5px 11px;cursor:pointer;font:inherit}
#rvBar button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#rvBar .rvv{display:flex;gap:4px;margin-inline-start:auto}
#rvBar button.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.revmode #tabs,.revmode #inspector,.revmode #inspToggle{display:none}
.revmode #v{right:0;top:calc(var(--top-h) + var(--rv-h,46px))}
#rvBar .rva{display:flex;gap:8px}
#rvBar .rvn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
/* Review mode on phones: compact top line, big action buttons fixed at the bottom */
@media (max-width:640px){
  #rvBar{padding:6px 10px;gap:6px;font-size:12px;flex-wrap:nowrap}
  #rvBar .rvh,#rvBar .rvv button[data-rv]{display:none}
  #rvBar .rvn{max-width:none;flex:1;min-width:0}
  #rvBar .rvv{margin-inline-start:0}
  #rvBar .rva{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(15,23,42,.08)}
